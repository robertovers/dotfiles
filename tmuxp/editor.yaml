session_name: dev 
start_directory: ${PROJECT_DIR}

windows:
  - window_name: editor
    layout: main-vertical
    panes:
      - clear && tmux resizep -t 0 -x 50% && nv
      - clear && claude
  - window_name: console
    layout: main-vertical
    panes:
      - clear && tmux resizep -t 0 -x 50% && lg
      - clear
